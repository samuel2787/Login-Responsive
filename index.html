<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdminExpress</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="contenedor">

    <div class="azul">
      <h1>AdminExpress</h1>
    </div>

    <div class="formulario">
      <div class="caja">
        <h2>Let's <b>Sign In</b></h2>
        <p class="texto">Hey, Enter your details to get sign in to your account.</p>

        <p class="label">Email</p>
        <div class="input">
          <input type="text" placeholder="Enter Email">
        </div>

        <p class="label">Password</p>
        <div class="input">
          <input type="password" placeholder="Enter Password">

        </div>

        <p class="olvido">Forgot password?</p>

        <button>Sign In</button>

        <p class="registro">Don't have an account? <b>Sign Up</b></p>
      </div>
    </div>

  </div>

</body>
</html>
